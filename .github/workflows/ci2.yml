name: My First CI

on: push

jobs:
  test:
    
    runs-on: ubuntu-latest

    outputs:
     app-version: ${{ steps.version.outputs.version }}  

    steps:
      - uses: actions/checkout@v4
      - run: echo "Hello from My First CI"
      - run: pwd
      - run: ls
      - name: Step 1
        run: echo "I am Step 1"

      - name: Step 2
        run: echo "I am Step 2"

      - name: Step 3
        run: echo "I am Step 3"
      
      - name: Generate version
        id: version
        run: echo "version=1.0.5" >> "$GITHUB_OUTPUT" 
        
      - name: Show version
        run: echo "Version is ${{ steps.version.outputs.version }}"  
    


    
     

      - name: Success check
        if: success()
        run: echo "SUCCESS condition is true"

      - name: Failure check
        if: failure()
        run: echo "FAILURE condition is true" 
        
        
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Build Step
        run: echo "I am Build Job"
      - name: Show app version
        run: echo "Building version ${{ needs.test.outputs.app-version }}"
       
      - name: Show app version from test
        run: echo "Build is using version ${{ needs.test.outputs.app-version }}"       
     
      - name: Create build file
        run: echo "This is my application build" > app.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-build
          path: app.txt
     






  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Step
        run: echo "Application deployed successfully"      
      
    
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: my-build      
        
      - name: Check downloaded file
        run: cat app.txt     
